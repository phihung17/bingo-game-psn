version: '3.8'

services:
  bingo-game:
    build:
      context: .
      dockerfile: Dockerfile
      # If you want to force build args from compose, uncomment below:
      # args:
      #   PORT: ${PORT}
      #   HOSTNAME: ${HOSTNAME}
    image: dinhoangphihung17/bingo-game:latest
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - HOSTNAME=${HOSTNAME}
      - SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped
    # ports mapping will be provided by override (local) OR you can map here for server.
    ports:
      - '${HOST_PORT}:${PORT}'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:${PORT}/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bingo-network

networks:
  bingo-network:
    driver: bridge
